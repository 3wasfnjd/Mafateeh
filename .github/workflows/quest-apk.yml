name: Quest APK
# Builds, tests and verifies the native Meta Quest APK (quest-native/).
# Artifacts: APK, SHA-256, test report, APK verification report.
# A GitHub pre-release with a public download link is published when run
# manually with "publish" checked, or when the head commit message contains "[release]".
# "sideload_test" builds a test-key APK without the store entitlement check (installs
# directly on a headset in developer mode) and publishes it, even when store secrets exist.
on:
  push:
    branches: [main, quest-native]
    paths: ['quest-native/**', '.github/workflows/quest-apk.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub pre-release with the APK'
        type: boolean
        default: false
      sideload_test:
        description: 'Sideload test build: test key, no store entitlement check, own package id (installs beside the store version), published as a pre-release'
        type: boolean
        default: false
      upload_alpha:
        description: 'Upload to the Meta Horizon Store ALPHA channel (needs META_APP_ID, META_APP_SECRET and a private signing key)'
        type: boolean
        default: false
      age_group:
        description: 'Meta age group for the upload'
        type: choice
        options: [TEENS_AND_ADULTS, MIXED_AGES]
        default: TEENS_AND_ADULTS
permissions:
  contents: write
concurrency:
  # Pushes supersede each other; manual runs (store uploads, sideload builds) never
  # cancel one another or get cancelled by a push.
  group: quest-apk-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mafateeh-godot
          key: godot-4.6.3-stable-v1
      - name: Build, test and verify APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          OUT_DIR: ${{ github.workspace }}/build
          MAFATEEH_KEYSTORE_B64: ${{ !inputs.sideload_test && secrets.MAFATEEH_KEYSTORE_B64 || '' }}
          MAFATEEH_KEYSTORE_ALIAS: ${{ !inputs.sideload_test && secrets.MAFATEEH_KEYSTORE_ALIAS || '' }}
          MAFATEEH_KEYSTORE_PASSWORD: ${{ !inputs.sideload_test && secrets.MAFATEEH_KEYSTORE_PASSWORD || '' }}
          META_APP_ID: ${{ !inputs.sideload_test && secrets.META_APP_ID || '' }}
          TEST_PACKAGE: ${{ inputs.sideload_test && '1' || '0' }}
        run: bash quest-native/tools/ci/build_apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mafateeh-quest-${{ github.run_number }}
          path: |
            build/*.apk
            build/*.sha256
            build/*.txt
            build/export.log
          if-no-files-found: warn
      - name: Publish pre-release
        if: ${{ success() && (inputs.publish || inputs.sideload_test || contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' quest-native/project.godot)
          TAG="quest-v${VERSION}-build${{ github.run_number }}"
          {
            echo "Native Meta Quest build of مفاتيح — Mafateeh (Aboden Games — عبودين قيمز)."
            echo
            echo "This is a sideload test build. It is not a Meta Horizon Store release."
            echo "Test builds use the package com.abodengames.mafateeh.test and install beside the store version."
            echo "Install with developer mode + adb or Meta Quest Developer Hub: see docs/quest-native-install.md."
            echo
            echo '```'
            cat build/apk-report.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" build/*.apk build/*.sha256 build/apk-report.txt build/test-report.txt \
            --target "${{ github.sha }}" --prerelease --title "Mafateeh Quest ${VERSION} (build ${{ github.run_number }})" --notes-file notes.md
      - name: Upload to Meta Horizon Store (ALPHA)
        if: ${{ success() && inputs.upload_alpha && !inputs.sideload_test }}
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          HAS_RELEASE_KEY: ${{ secrets.MAFATEEH_KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          if [ -z "$META_APP_ID" ] || [ -z "$META_APP_SECRET" ]; then
            echo "::error::Add repository secrets META_APP_ID and META_APP_SECRET (Developer Dashboard > your app > API)."; exit 1
          fi
          if [ "$HAS_RELEASE_KEY" != "true" ]; then
            echo "::error::Refusing to upload a build signed with the public test key. Add MAFATEEH_KEYSTORE_B64/ALIAS/PASSWORD."; exit 1
          fi
          # Meta's official OVR Platform Utility (Linux build), from oculus.com.
          curl -fL --retry 4 -o ovr-platform-util "https://www.oculus.com/download_app/?id=5159709737372459"
          chmod +x ovr-platform-util
          ./ovr-platform-util version || true
          ./ovr-platform-util upload-quest-build --app-id "$META_APP_ID" --app-secret "$META_APP_SECRET" \
            --apk "$APK" --channel ALPHA --age-group "${{ inputs.age_group }}" \
            --notes "Build ${{ github.run_number }} from ${{ github.sha }}"
